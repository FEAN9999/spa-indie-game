<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <clipPath id="lens"><circle cx="300" cy="250" r="206"/></clipPath>
  </defs>
  <!-- bóng sàn của đèn lúp -->
  <ellipse cx="306" cy="476" rx="200" ry="14" fill="#4A2E22" opacity=".18"/>

  <!-- cận cảnh qua đèn lúp: da, tóc mai, sống mũi, chân mày, mí -->
  <g clip-path="url(#lens)">
    <rect x="80" y="30" width="440" height="440" fill="#EBC3A0"/>
    <!-- bóng phẳng: hốc mắt dưới chân mày, cạnh sống mũi -->
    <path d="M176,252 C240,220 360,220 424,252 C420,236 410,222 396,212 C330,196 260,198 200,218 C190,228 182,240 176,252 Z" fill="#DDAF88"/>
    <path d="M470,120 C462,200 466,280 484,350 C500,330 520,260 520,200 L520,100 Z" fill="#DDAF88"/>
    <path d="M470,120 C462,200 466,280 484,350" fill="none" stroke="#4A2E22" stroke-width="4" stroke-linecap="round"/>
    <!-- tóc mai -->
    <path d="M60,20 L340,20 C280,44 226,76 190,116 C160,150 142,196 140,250 C138,300 122,360 84,430 L60,430 Z" fill="#5B3A29"/>
    <path d="M60,20 L340,20 C300,36 262,56 230,80 L60,80 Z" fill="#4A3226"/>
    <path d="M340,20 C280,44 226,76 190,116 C160,150 142,196 140,250 C138,300 122,360 84,430" fill="none" stroke="#4A2E22" stroke-width="5" stroke-linecap="round"/>
