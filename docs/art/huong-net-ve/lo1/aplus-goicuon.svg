<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <clipPath id="inside"><ellipse cx="258" cy="226" rx="218" ry="134"/></clipPath>
    <clipPath id="paper"><ellipse cx="168" cy="212" rx="118" ry="76" transform="rotate(-8 168 212)"/></clipPath>
    <clipPath id="roll"><rect x="-100" y="-34" width="200" height="68" rx="34"/></clipPath>
    <!-- vân đan của bánh tráng -->
    <pattern id="dan" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <path d="M0,0 V11 M0,0 H11" stroke="#D9C9AE" stroke-width="1.6"/>
    </pattern>
    <!-- nửa con tôm luộc: mặt cắt hồng có sọc đỏ -->
    <g id="tomnua">
      <path d="M-20,6 C-22,-10 -6,-20 10,-16 C20,-13 24,-4 20,4 C14,0 4,-4 -4,0 C-10,3 -14,6 -20,6 Z" fill="#F2A48E" stroke="#4A2E22" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M-14,-6 C-12,-10 -8,-12 -4,-13 M-2,-14 C2,-15 6,-15 10,-14 M12,-12 C16,-10 18,-6 19,-2" fill="none" stroke="#D8463A" stroke-width="3" stroke-linecap="round"/>
      <path d="M-14,3 C-8,-2 2,-6 12,-2" fill="none" stroke="#FBF7EE" stroke-width="2" stroke-linecap="round" opacity=".8"/>
    </g>
  </defs>

  <!-- bóng sàn -->
  <ellipse cx="270" cy="244" rx="240" ry="150" fill="#4A2E22" opacity=".18"/>
  <ellipse cx="458" cy="438" rx="132" ry="22" fill="#4A2E22" opacity=".18"/>

  <!-- thau men: vành xanh men, lòng men trắng, đáy vẽ bông hoa -->
