  <path d="M206,120 q-16,8 -14,22 M226,300 q16,-6 18,-20" fill="none" stroke="#7FC4D8" stroke-width="3.5" stroke-linecap="round"/>
  <g fill="#BFE3F2" stroke="#4A2E22" stroke-width="1.8"><path d="M58,268 q4,8 0,12 q-4,-4 0,-12 Z"/><path d="M74,282 q3,6 0,9 q-3,-3 0,-9 Z"/></g>

  <!-- lá chuối lót -->
  <g transform="translate(454 414) rotate(-10)">
    <path d="M-132,0 C-92,-46 60,-54 132,-6 C72,40 -80,48 -132,0 Z" fill="#4E9A6B"/>
    <path d="M-132,0 C-80,48 72,40 132,-6 C60,22 -60,26 -132,0 Z" fill="#4B875E"/>
    <path d="M-110,-14 l14,12 M-80,-26 l18,22 M-46,-34 l20,30 M-10,-38 l20,34 M26,-38 l18,32 M62,-32 l16,26 M96,-22 l12,16 M-100,14 l16,-12 M-66,24 l18,-22 M-30,28 l20,-26 M8,28 l20,-26 M46,24 l18,-22 M82,14 l14,-14" stroke="#5FAE7B" stroke-width="2" stroke-linecap="round" opacity=".8"/>
    <path d="M-128,0 C-40,-6 60,-8 128,-6" fill="none" stroke="#5FAE7B" stroke-width="4" stroke-linecap="round"/>
    <path d="M-132,0 C-92,-46 60,-54 132,-6 C72,40 -80,48 -132,0 Z" fill="none" stroke="#4A2E22" stroke-width="5" stroke-linejoin="round"/>
    <path d="M40,30 l4,-10 M-60,34 l3,-9" stroke="#4A2E22" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- cuốn đã cuốn: nhìn qua lớp bánh tráng thấy bún, xà lách, rau thơm, tôm, thịt -->
  <ellipse cx="456" cy="428" rx="118" ry="15" fill="#2B201C" opacity=".22"/>
  <g transform="translate(452 392) rotate(-8) scale(1.15)">
    <rect x="-100" y="-34" width="200" height="68" rx="34" fill="#FBF7EE"/>
    <g clip-path="url(#roll)">
      <path d="M-100,14 q12,-8 24,0 t24,0 t24,0 t24,0 t24,0 t24,0 t24,0 t24,0 M-100,24 q12,-8 24,0 t24,0 t24,0 t24,0 t24,0 t24,0 t24,0 t24,0" fill="none" stroke="#E2D3BC" stroke-width="6"/>
      <path d="M-100,14 q12,-8 24,0 t24,0 t24,0 t24,0 t24,0 t24,0 t24,0 t24,0 M-100,24 q12,-8 24,0 t24,0 t24,0 t24,0 t24,0 t24,0 t24,0 t24,0" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M-104,8 L-104,-8 q8,-12 16,-2 q8,-12 16,-2 q8,-12 16,-2 q8,-12 16,-2 q8,-12 16,-2 q8,-12 16,-2 q8,-12 16,-2 q8,-12 16,-2 q8,-12 16,-2 q8,-12 16,-2 q8,-12 16,-2 q8,-12 16,-2 q8,-12 16,-2 L104,8 Z" fill="#5FAE7B" stroke="#4A2E22" stroke-width="2"/>
      <path d="M-80,0 l6,-8 M-40,2 l6,-8 M0,0 l6,-8 M40,2 l6,-8 M80,0 l6,-8" stroke="#4E9A6B" stroke-width="2" stroke-linecap="round"/>
      <g fill="#4E9A6B" stroke="#4A2E22" stroke-width="1.5">
        <ellipse cx="-70" cy="-22" rx="9" ry="4.5" transform="rotate(-20 -70 -22)"/><ellipse cx="-28" cy="-24" rx="9" ry="4.5" transform="rotate(15 -28 -24)"/><ellipse cx="18" cy="-22" rx="9" ry="4.5" transform="rotate(-10 18 -22)"/><ellipse cx="62" cy="-24" rx="9" ry="4.5" transform="rotate(25 62 -24)"/>
      </g>
      <g fill="#F2C4C0" stroke="#4A2E22" stroke-width="1.5"><rect x="-48" y="-14" width="20" height="7" rx="3"/><rect x="34" y="-14" width="20" height="7" rx="3"/></g>
      <use href="#tomnua" transform="translate(-66 -4)"/>
      <use href="#tomnua" transform="translate(-2 -6) scale(1.05)"/>
      <use href="#tomnua" transform="translate(66 -4)"/>
      <!-- lớp bánh tráng trong mờ phủ lên trên -->
      <rect x="-100" y="-34" width="200" height="68" fill="#FBF3E4" opacity=".25"/>
      <rect x="-100" y="-34" width="200" height="68" fill="url(#dan)" opacity=".35"/>
      <path d="M-100,18 C-40,30 40,30 100,18 L100,40 L-100,40 Z" fill="#3A2418" opacity=".1"/>
      <path d="M-80,-24 C-30,-30 30,-30 80,-24" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".6"/>
      <path d="M-60,-14 C-30,-17 0,-17 20,-15" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".5"/>
    </g>
    <rect x="-100" y="-34" width="200" height="68" rx="34" fill="none" stroke="#4A2E22" stroke-width="5"/>
    <path d="M-76,-30 C-84,-16 -84,14 -76,30 M78,-30 C86,-16 86,14 78,30" fill="none" stroke="#E2D3BC" stroke-width="2.5"/>
    <!-- cọng hẹ thò ra đầu cuốn -->
    <path d="M-98,-8 C-124,-18 -146,-6 -170,-24" fill="none" stroke="#4A2E22" stroke-width="7" stroke-linecap="round"/>
    <path d="M-98,-8 C-124,-18 -146,-6 -170,-24" fill="none" stroke="#6DB36A" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
