  <ellipse cx="258" cy="226" rx="226" ry="140" fill="none" stroke="#FBF7EE" stroke-width="2.5" opacity=".8"/>
  <path d="M40,190 A236,148 0 0 1 180,84" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".45"/>
  <ellipse cx="258" cy="226" rx="218" ry="134" fill="#FBF7EE" stroke="#4A2E22" stroke-width="4"/>
  <g clip-path="url(#inside)">
    <path d="M40,226 A218,134 0 0 1 476,226 L476,150 C400,110 120,110 40,150 Z" fill="#DCD5CC"/>
    <ellipse cx="262" cy="244" rx="184" ry="108" fill="#F6ECDB"/>
    <!-- bông hoa in trên đáy -->
    <g transform="translate(318 260)">
      <g fill="#D8463A" stroke="#A8302A" stroke-width="2">
        <ellipse cx="0" cy="-16" rx="13" ry="10"/><ellipse cx="16" cy="-2" rx="13" ry="10"/><ellipse cx="9" cy="16" rx="13" ry="10"/><ellipse cx="-10" cy="14" rx="13" ry="10"/><ellipse cx="-16" cy="-4" rx="13" ry="10"/>
      </g>
      <circle r="8" fill="#F7C531" stroke="#C78A22" stroke-width="2"/>
      <path d="M22,10 C40,6 52,16 56,26 C42,28 30,22 22,10 Z M-22,10 C-34,22 -34,34 -28,42 C-18,34 -16,22 -22,10 Z" fill="#4E9A6B" stroke="#2F7D6E" stroke-width="2"/>
    </g>
    <!-- nước -->
