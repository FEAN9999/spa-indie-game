    <path d="M60,236 A204,122 0 0 1 166,124" fill="none" stroke="#7FC4D8" stroke-width="4" opacity=".7"/>
    <path d="M300,322 q24,-10 48,0 t48,0 M370,180 q20,-8 40,0 t40,0 M330,214 q16,-6 32,0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- bánh tráng đang nhúng: phần khô bên trái, phần ướt chìm dưới nước bên phải -->
  <ellipse cx="168" cy="212" rx="118" ry="76" transform="rotate(-8 168 212)" fill="#F3E6D3"/>
  <g clip-path="url(#paper)">
    <rect x="40" y="120" width="260" height="190" fill="url(#dan)"/>
    <path d="M40,150 C70,140 96,150 110,170 L40,200 Z" fill="#FFFFFF" opacity=".45"/>
    <path d="M200,110 C196,170 204,230 214,310 L310,310 L310,110 Z" fill="#BFE3F2" opacity=".55"/>
    <path d="M206,110 C202,170 210,230 220,310" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".8"/>
    <path d="M226,150 C240,148 252,154 262,162 M232,240 C246,238 258,244 268,252" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".6"/>
    <path d="M60,270 C120,300 220,290 290,250 L300,320 L50,320 Z" fill="#3A2418" opacity=".1"/>
  </g>
  <ellipse cx="168" cy="212" rx="112" ry="70" transform="rotate(-8 168 212)" fill="none" stroke="#E2D3BC" stroke-width="5"/>
  <ellipse cx="168" cy="212" rx="118" ry="76" transform="rotate(-8 168 212)" fill="none" stroke="#4A2E22" stroke-width="4"/>
