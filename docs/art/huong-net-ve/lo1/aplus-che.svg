  <path d="M245,84 C245,92 244,98 246,102" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- muỗng dài cắm vào đá: cán bạc có gờ sáng, đầu cán loe -->
  <path d="M352,36 L470,6" stroke="#4A2E22" stroke-width="12" stroke-linecap="round"/>
  <path d="M352,36 L470,6" stroke="#C9CFD3" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M362,31 L462,6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  <ellipse cx="476" cy="5" rx="12" ry="8" transform="rotate(-14 476 5)" fill="#C9CFD3" stroke="#4A2E22" stroke-width="3.5"/>
</svg>
