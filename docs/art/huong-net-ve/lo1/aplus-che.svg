    <path d="M270,24 l3,6 l6,3 l-6,3 l-3,6 l-3,-6 l-6,-3 l6,-3 Z"/>
    <path d="M392,48 l2.5,5 l5,2.5 l-5,2.5 l-2.5,5 l-2.5,-5 l-5,-2.5 l5,-2.5 Z"/>
