    <path d="M206,52 C214,40 230,34 244,36" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <!-- nước cốt dừa rưới trên đỉnh -->
    <path d="M228,46 C250,30 300,24 338,34 C362,30 392,44 402,62 C388,58 376,66 364,58 C350,50 332,62 318,52 C300,42 284,58 266,50 C252,44 240,56 228,46 Z" fill="#FBF7EE" stroke="#4A2E22" stroke-width="2.5" stroke-linejoin="round"/>
