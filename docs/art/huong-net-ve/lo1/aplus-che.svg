    <path d="M196,420 L404,420 L404,460 L196,460 Z" fill="#CFE8F0" opacity=".85"/>
    <path d="M206,436 C260,428 340,428 394,436" fill="none" stroke="#FFFFFF" stroke-width="4" opacity=".7"/>
