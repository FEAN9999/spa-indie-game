      <ellipse cx="380" cy="342" rx="11" ry="8" transform="rotate(40 380 342)"/><ellipse cx="222" cy="378" rx="11" ry="8" transform="rotate(-40 222 378)"/><ellipse cx="252" cy="390" rx="11" ry="8" transform="rotate(15 252 390)"/>
