<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F3E6D3" />
    <title>Tiệm Spa</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #F3E6D3;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* save-code boxes over the canvas, sized in canvas px (Phaser scales them with the game) */
      /* Phaser sets display: block on the root itself, so the children stack as full-width blocks */
      .spa-dom {
        width: 760px;
      }
      .spa-dom textarea {
        display: block;
        box-sizing: border-box;
        width: 100%;
        margin-bottom: 24px;
        height: 300px;
        padding: 20px;
        font: 600 32px 'Be Vietnam Pro', sans-serif;
        color: #4A2E22;
        background: #FBF7EE;
        border: 4px solid #4A2E22;
        border-radius: 24px;
        resize: none;
        outline: none;
        /* a scrolling box inside Phaser's scaled layer paints a stray white block below it; copy and paste use the whole value anyway */
        overflow: hidden;
        word-break: break-all;
        user-select: text;
        -webkit-user-select: text;
        touch-action: auto;
      }
      .spa-dom button {
        display: block;
        box-sizing: border-box;
        width: 100%;
        height: 120px;
        font: 800 44px 'Be Vietnam Pro', sans-serif;
        color: #FBF3E4;
        background: #2F7D6E;
        border: 4px solid #4A2E22;
        border-radius: 60px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
