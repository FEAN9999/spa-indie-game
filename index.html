<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F3E6D3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tiệm Spa" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Tiệm Spa</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #F3E6D3;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      /* inside the notch and home bar; insets rather than padding, since Phaser fits the canvas to the parent's full box */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      /* save-code boxes over the canvas, sized in canvas px (Phaser scales them with the game) */
      /* Phaser sets display: block on the root itself, so the children stack as full-width blocks */
      .spa-dom {
        width: 760px;
      }
      .spa-dom textarea {
        display: block;
        box-sizing: border-box;
        width: 100%;
        margin-bottom: 24px;
        height: 300px;
        padding: 20px;
        font: 600 32px 'Be Vietnam Pro', sans-serif;
        color: #4A2E22;
        background: #FBF7EE;
        border: 4px solid #4A2E22;
        border-radius: 24px;
        resize: none;
        outline: none;
        /* a scrolling box inside Phaser's scaled layer paints a stray white block below it; copy and paste use the whole value anyway */
        overflow: hidden;
        word-break: break-all;
        user-select: text;
        -webkit-user-select: text;
        /* body turns the long-press menu off for the game; the code box needs it for Paste on iPhone */
        -webkit-touch-callout: default;
        touch-action: auto;
      }
      .spa-dom.spa-name {
        width: 600px;
      }
      .spa-dom input {
        display: block;
        box-sizing: border-box;
        width: 100%;
        /* 120px tall from the line and the padding: with a set height the box clips stacked marks like the tilde on Ẵ */
        padding: 20px 32px;
        font: 600 44px 'Be Vietnam Pro', sans-serif;
        line-height: 72px;
        color: #4A2E22;
        background: #FBF7EE;
        border: 4px solid #4A2E22;
        border-radius: 60px;
        outline: none;
        user-select: text;
        -webkit-user-select: text;
        -webkit-touch-callout: default;
        touch-action: auto;
      }
      .spa-dom button {
        display: block;
        box-sizing: border-box;
        width: 100%;
        height: 120px;
        font: 800 44px 'Be Vietnam Pro', sans-serif;
        color: #FBF3E4;
        background: #2F7D6E;
        border: 4px solid #4A2E22;
        border-radius: 60px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
